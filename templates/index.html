<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Toretito AI kawai :3 XD</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1e1e1e;
    color: #eee;
    display: flex;
    justify-content: center;
    height: 100vh;
  }
  #contenedor {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    color: #ccc;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    padding: 10px 15px;
    border-radius: 12px;
    max-width: 75%;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user {
    background: #3a6ff7;
    align-self: flex-end;
  }
  .bot {
    background: #2d2d2d;
    align-self: flex-start;
  }
  #vista-previa {
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #vista-previa img {
    height: 60px;
    border-radius: 8px;
    border: 1px solid #444;
  }
  #quitar-imagen {
    background: #444;
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 12px;
  }
  #form {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  #pregunta {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #fff;
    font-size: 15px;
  }
  #enviar {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #3a6ff7;
    color: white;
    cursor: pointer;
    font-size: 18px;
  }
  #enviar:hover { background: #2f5ad1; }
  #boton-imagen {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: #2a2a2a;
    border: 1px solid #444;
    cursor: pointer;
    font-size: 20px;
    flex-shrink: 0;
  }
  #boton-imagen:hover {
    background: #333;
  }
</style>
</head>
<body>
<div id="contenedor">
  <h1>Toretito AI</h1>
  <div id="chat"></div>
  <div id="vista-previa" style="display:none;"></div>
  <form id="form">
    <label for="imagen" id="boton-imagen" title="Adjuntar imagen">📎</label>
    <input type="file" id="imagen" accept="image/*" style="display:none;" />
    <input id="pregunta" autocomplete="off" placeholder="Escribe un mensaje..." />
    <button id="enviar" type="submit" title="Enviar">➤</button>
  </form>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('pregunta');
const inputImagen = document.getElementById('imagen');
const vistaPrevia = document.getElementById('vista-previa');

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    form.requestSubmit();
  }
});

function agregarMensaje(texto, clase, urlImagen) {
  const div = document.createElement('div');
  div.className = 'msg ' + clase;

  if (urlImagen) {
    const img = document.createElement('img');
    img.src = urlImagen;
    img.style.maxWidth = '100%';
    img.style.borderRadius = '8px';
    img.style.display = 'block';
    if (texto) img.style.marginBottom = '6px';
    div.appendChild(img);
  }

  if (texto) {
    const p = document.createElement('div');
    p.textContent = texto;
    div.appendChild(p);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function leerImagenComoBase64(archivo) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(archivo);
  });
}

inputImagen.addEventListener('change', () => {
  const archivo = inputImagen.files[0];
  if (!archivo) {
    vistaPrevia.style.display = 'none';
    vistaPrevia.innerHTML = '';
    return;
  }
  const url = URL.createObjectURL(archivo);
  vistaPrevia.innerHTML = `<img src="${url}" /><button id="quitar-imagen" type="button">Quitar</button>`;
  vistaPrevia.style.display = 'flex';

  document.getElementById('quitar-imagen').addEventListener('click', () => {
    inputImagen.value = '';
    vistaPrevia.style.display = 'none';
    vistaPrevia.innerHTML = '';
  });
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const texto = input.value.trim();
  const archivo = inputImagen.files[0];

  if (!texto && !archivo) return;

  let urlImagenPreview = null;
  if (archivo) {
    urlImagenPreview = URL.createObjectURL(archivo);
  }

  agregarMensaje(texto, 'user', urlImagenPreview);
  input.value = '';

  let imagenBase64 = null;
  let mimeType = null;

  if (archivo) {
    imagenBase64 = await leerImagenComoBase64(archivo);
    mimeType = archivo.type;
    inputImagen.value = '';
    vistaPrevia.style.display = 'none';
    vistaPrevia.innerHTML = '';
  }

  const res = await fetch('/preguntar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mensaje: texto, imagen: imagenBase64, mime_type: mimeType })
  });
  const data = await res.json();
  agregarMensaje(data.respuesta, 'bot');
});
</script>
</body>
</html>
